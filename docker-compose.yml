name: moodverse

# Every service reads its configuration from .env (copy .env.example first).
# The only values set inline are the ones that must differ inside the network
# from what a developer running the backend on the host would use.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: moodverse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moodverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodverse}
      POSTGRES_DB: ${POSTGRES_DB:-moodverse}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55433}:5432"
    volumes:
      - moodverse-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moodverse} -d ${POSTGRES_DB:-moodverse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # The public API. Owns migrations; no worker runs them.
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: moodverse-backend:local
    container_name: moodverse-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moodverse}:${POSTGRES_PASSWORD:-moodverse}@db:5432/${POSTGRES_DB:-moodverse}
      RUN_MIGRATIONS: "1"
      MOODVERSE_DATA_DIR: /data
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8000"
    volumes:
      - ./data:/data:ro

  # Heavy queue: reflection analysis and voice transcription.
  worker-heavy:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: moodverse-backend:local
    container_name: moodverse-worker-heavy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moodverse}:${POSTGRES_PASSWORD:-moodverse}@db:5432/${POSTGRES_DB:-moodverse}
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - -Q
      - ${CELERY_QUEUE_HEAVY:-heavy}
      - --concurrency=${CELERY_HEAVY_CONCURRENCY:-2}
      - --loglevel=info
    healthcheck:
      # Broker reachability, not `celery inspect ping`: the SQLAlchemy transport
      # implements no fanout exchange, so inspect hangs rather than replying.
      test: ["CMD-SHELL", "python -c \"from app.core.celery_app import celery_app; celery_app.connection().ensure_connection(max_retries=1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Light queue: outbound email only.
  worker-light:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: moodverse-backend:local
    container_name: moodverse-worker-light
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moodverse}:${POSTGRES_PASSWORD:-moodverse}@db:5432/${POSTGRES_DB:-moodverse}
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - -Q
      - ${CELERY_QUEUE_LIGHT:-light}
      - --concurrency=${CELERY_LIGHT_CONCURRENCY:-4}
      - --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.core.celery_app import celery_app; celery_app.connection().ensure_connection(max_retries=1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # One-shot corpus load. Excluded from `up`: docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: moodverse-backend:local
    container_name: moodverse-ingest
    profiles: [tools]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moodverse}:${POSTGRES_PASSWORD:-moodverse}@db:5432/${POSTGRES_DB:-moodverse}
      MOODVERSE_DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    entrypoint: [python, ingest.py]
    command: [--only-servable]

volumes:
  moodverse-pgdata:
    # Named explicitly so renaming the checkout directory cannot orphan the data.
    name: moodverse-pgdata
