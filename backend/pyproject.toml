[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodverse-backend"
version = "0.1.0"
description = "MoodVerse backend: curated scripture retrieval for emotional reflection."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # SQLAlchemy needs greenlet for its asyncio bridge.
    "greenlet>=3.0",
    # Auth. Authlib drives the Google OIDC flow (its Starlette integration);
    # joserfc is its maintained JOSE implementation and issues the app's own
    # access/refresh JWTs, so one JOSE library covers both. bcrypt hashes
    # passwords directly rather than through passlib. itsdangerous signs the
    # session cookie SessionMiddleware uses to carry OIDC state/nonce.
    # python-multipart is required by OAuth2PasswordRequestForm on /auth/login,
    # and pydantic's EmailStr needs email-validator.
    "authlib>=1.3",
    # authlib.integrations.starlette_client imports its httpx_client submodule
    # unconditionally (for the OAuth1 client class it also defines), so httpx
    # is a real runtime dependency here even though only OAuth2/OIDC is used.
    "httpx>=0.27",
    "joserfc>=1.0",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    # Background jobs. Broker (Kombu's SQLAlchemy transport, `sqla+...`) and
    # result backend (Celery's own SQLAlchemy backend, `db+...`) both point at
    # database_url by default - see app/core/celery_app.py - so no Redis or
    # second service is needed to run the heavy/light queues.
    "celery>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
